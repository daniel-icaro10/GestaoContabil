# Blueprint do Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: diagnostico-tributario
    runtime: node
    region: virginia
    # O banco SQLite fica em disco persistente, disponível a partir do plano Starter.
    plan: starter
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: APP_SECRET
        generateValue: true
    # O administrador NÃO é configurado por variável de ambiente: ele vem pré-cadastrado em
    # server/src/admin-seed.ts (apenas e-mail + hash bcrypt da senha).
